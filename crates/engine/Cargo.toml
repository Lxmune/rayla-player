[package]
name = "rayla_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rayla_dsp = { path = "../dsp" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = [
    "flac", "alac", "isomp4", "wav", "aiff", "pcm", "mp3", "aac", "vorbis", "ogg",
] }
# TLS comes from the OS (schannel / Security.framework) on Windows and macOS and
# from rustls (bundled Mozilla roots) on Android and Linux.
ureq = { version = "2", default-features = false }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "android")'.dependencies]
# AAudio output (API 26+).
ndk-sys = { version = "0.6", features = ["audio"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19"
# MMCSS "Pro Audio" scheduling for the thread that feeds the device.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
# ALSA output: `hw:` devices for exclusive/bit-perfect, `default` (PipeWire/Pulse) for shared.
alsa = "0.9"
