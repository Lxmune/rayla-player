[package]
name = "rayla_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rayla_dsp = { path = "../dsp" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = [
    "flac", "alac", "isomp4", "wav", "aiff", "pcm", "mp3", "aac", "vorbis", "ogg",
] }
# TLS comes from the OS (schannel / Security.framework) on desktop and from
# rustls on Android; other hosts (Linux CI) only need plain HTTP for the tests.
ureq = { version = "2", default-features = false }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
# AAudio output (API 26+).
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-26"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.12"
