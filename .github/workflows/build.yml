name: build
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Engine + DSP only: the Tauri crate needs WebKitGTK to build on Linux.
      - run: cargo test -p rayla_dsp -p rayla_engine
      - run: npm ci
      - run: npm run check
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: target/release/bundle
          - os: macos-latest
            bundles: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: rayla-${{ matrix.os }}
          path: ${{ matrix.bundles }}
