name: release

# Push a tag `vX.Y.Z` (matching the version in package.json, src-tauri/tauri.conf.json and
# src-tauri/Cargo.toml) to build every platform and attach the installers to a *draft*
# GitHub release. Review the draft on the Releases tab, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version package.json)" \
                   "$(jq -r .version src-tauri/tauri.conf.json)" \
                   "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $v"; exit 1
            fi
          done
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Rayla $GITHUB_REF_NAME"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                 --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: ''
            args: ''
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # 22.04 keeps the AppImage compatible with older glibc versions.
          - os: ubuntu-22.04
            rust_targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds the bundles (Windows: NSIS .exe + .msi; macOS: universal .dmg + .app.tar.gz;
      # Linux: .deb, .rpm, .AppImage) and uploads them to the draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
      # Portable Windows build: the bare exe, runs without installing (needs the
      # WebView2 runtime, which ships with Windows 10 and 11).
      - name: Upload portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="Rayla_${GITHUB_REF_NAME#v}_x64_portable.exe"
          cp target/release/rayla.exe "$exe"
          gh release upload "$GITHUB_REF_NAME" "$exe" --clobber

  android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android build --apk --target aarch64 armv7 x86_64
      # The APK is unsigned: sign it with your own key (apksigner) before installing.
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          if [ -z "$src" ]; then echo "::error::No APK was produced"; exit 1; fi
          apk="Rayla_${GITHUB_REF_NAME#v}_android_universal_unsigned.apk"
          cp "$src" "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
