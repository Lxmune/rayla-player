[package]
name = "tauri-plugin-rayla-android"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rayla: Android media service, media session and audio output enumeration."
links = "tauri-plugin-rayla-android"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
