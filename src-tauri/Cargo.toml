[package]
name = "rayla"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rayla: a minimal Jellyfin music player with an audiophile signal chain."

[lib]
name = "rayla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
tauri-plugin-dialog = "2"
tauri-plugin-rayla-android = { path = "plugins/rayla-android" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayla_engine = { path = "../crates/engine" }

# Android has no keyring backend; secrets live in the app-private data dir there.
[target.'cfg(not(target_os = "android"))'.dependencies]
# Linux: the Secret Service (GNOME Keyring, KWallet) over pure-Rust zbus with the async-io
# executor (no tokio runtime needed when blocking on it from a command).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }

# Desktop OS media controls: media keys, Windows SMTC, macOS Now Playing, Linux MPRIS.
# `use_zbus` (pure Rust) instead of the default libdbus backend: no libdbus headers needed.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
