[package]
name = "rayla"
version = "0.1.0"
edition = "2021"
description = "Rayla: a minimal Jellyfin music player with an audiophile signal chain."

[lib]
name = "rayla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
tauri-plugin-dialog = "2"
tauri-plugin-rayla-android = { path = "plugins/rayla-android" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayla_engine = { path = "../crates/engine" }

# Android has no keyring backend; secrets live in the app-private data dir there.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
